<article class="tarjeta">
  {% set foto = url_foto(receta) %}
  {% if foto %}
    <img class="foto-tarjeta" src="{{ foto }}" alt="" loading="lazy" width="640" height="400">
  {% endif %}
  <span class="etiqueta">{{ receta.pais }}</span>
  <h3><a href="{{ url_for('detalle', receta_id=receta.id) }}">{{ receta.nombre }}</a></h3>
  <p>{{ receta.categoria }} · {{ receta.tiempo }} min</p>
</article>
